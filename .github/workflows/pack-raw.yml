name: Pack old raw snapshots

# raw/ grows ~400 MB/day as ~8.6k objects and nothing reads past the 36-day
# retrain window by default. Pack each day older than 45 days into one xz tar
# (~8x smaller) and delete the originals; src.snapshots reads either form.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'  # daily, off-peak

concurrency:
  group: pack-raw
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Pack
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            gtfs-lviv
        run: python scripts/pack_raw.py
