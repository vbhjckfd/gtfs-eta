name: Push GTFS-RT feed

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). The job pushes for ~5.5 min — longer
    # than the cron period on purpose, so the outgoing run is still publishing
    # while the incoming one boots. See the guard below.
    - cron: '*/5 * * * *'
  workflow_dispatch:  # manual trigger, and the Cloudflare worker watchdog
    inputs:
      retry_depth:
        description: 'Internal — depth of the automatic retry chain (leave at 0)'
        default: '0'

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check for concurrent runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # A run is ~45 s of boot (checkout, pip install, R2 load) followed by
          # PUSH_SECONDS of publishing. With the old "any concurrent run blocks
          # this one" rule, that boot cost was dead air: the previous run's last
          # push landed ~75 s before the new run's first one, every cycle, and
          # the served blob simply froze in between (measured 71-90 s).
          #
          # So a run that is already past OVERLAP_AFTER_S no longer blocks a new
          # one — it is inside its final stretch and about to exit, and the two
          # briefly publishing together is exactly what closes the gap. Whole
          # blobs are written each push, last write wins, so an overlap is
          # harmless; the only visible effect is that alternating writers carry
          # slightly different tracker state for a few seconds.
          #
          # A younger run still blocks (that is a genuine duplicate — a retry or
          # watchdog dispatch racing the cron), and one older than STUCK_AFTER_S
          # is hung rather than finishing, so it gets cancelled. STUCK_AFTER_S
          # must stay above boot + PUSH_SECONDS or healthy runs get killed.
          OVERLAP_AFTER_S=240
          STUCK_AFTER_S=480
          proceed=true
          now=$(date +%s)
          while IFS=$'\t' read -r id started_at; do
            [ "$id" = "$RUN_ID" ] && continue
            started_s=$(date -d "$started_at" +%s)
            age_s=$(( now - started_s ))
            if [ "$age_s" -ge "$STUCK_AFTER_S" ]; then
              echo "Cancelling stuck run $id (${age_s}s old)"
              # The run can finish between the list above and this call; that is
              # the outcome we wanted anyway, so do not fail the guard on it.
              gh run cancel "$id" --repo "$REPO" || echo "  (already finished)"
            elif [ "$age_s" -ge "$OVERLAP_AFTER_S" ]; then
              echo "Overlapping run $id (${age_s}s old) is finishing — proceeding"
            else
              echo "Skipping: run $id already in progress (${age_s}s old)"
              proceed=false
            fi
          done < <(gh run list --repo "$REPO" --workflow push-feed.yml --status in_progress \
            --json databaseId,startedAt --jq '.[] | [.databaseId, .startedAt] | @tsv')
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  push-feed:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # safety net — normal runtime is ~4 min

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      # Load GTFS + model from R2 once, push 33 times at 10 s intervals (~5.5
      # min). The loop is drift-free (the interval includes inference time), so
      # the run overruns the 5-minute cron period by roughly its own boot cost —
      # which is the point: the next run is already booting while this one still
      # publishes, so the feed never goes unrefreshed. Resources stay in memory
      # across pushes; only one R2 load per job.
      - name: Push feed every 10 s
        run: python scripts/push_feed.py --loop 10 --count 33
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            gtfs-lviv
          GTFS_RT_URL:          https://track.ua-gis.com/gtfs/lviv/vehicle_position
          SENTRY_DSN:           ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE:       ${{ github.sha }}

  # Most failures here are GitHub-side and transient: action download returning
  # "Service Unavailable" during Set up job, or "The job was not acquired by
  # Runner of type hosted".  Neither can be retried from inside the job — it
  # never starts — so recovery has to be a fresh dispatch.  Without one the feed
  # stays stale until the next 5-minute cron.
  retry:
    needs: [guard, push-feed]
    if: ${{ always() && (needs.guard.result == 'failure' || needs['push-feed'].result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Back off, then dispatch a replacement run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DEPTH: ${{ github.event.inputs.retry_depth || '0' }}
        run: |
          MAX_DEPTH=2
          if [ "$DEPTH" -ge "$MAX_DEPTH" ]; then
            echo "Retry chain at depth $DEPTH — giving up, the 5-minute cron takes over."
            exit 0
          fi

          # A GitHub blip usually clears inside a minute; an immediate retry just
          # hits the same wall. 60 s on the first retry, 120 s on the second.
          sleep $(( 60 * (DEPTH + 1) ))

          # Cron or the Cloudflare watchdog may have started a run in the
          # meantime. Retrying on top of it duplicates the push and, during a
          # runner-capacity outage, deepens the very queue that caused the
          # failure. Run IDs increase monotonically, so "newer" is an ID compare.
          active=$(gh run list --repo "$REPO" --workflow push-feed.yml --limit 30 \
                     --json databaseId,status \
                   | jq --argjson me "$RUN_ID" \
                       '[.[] | select(.databaseId > $me
                                      and (.status == "in_progress" or .status == "queued"))] | length')
          if [ "$active" -gt 0 ]; then
            echo "$active newer run(s) already active — skipping retry."
            exit 0
          fi

          echo "Dispatching retry at depth $(( DEPTH + 1 ))"
          gh workflow run push-feed.yml --repo "$REPO" --ref "$REF" \
            -f retry_depth="$(( DEPTH + 1 ))"
