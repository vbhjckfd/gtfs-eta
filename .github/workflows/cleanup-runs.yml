name: Clean up old workflow runs

on:
  schedule:
    - cron: '17 3 * * *'  # daily
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Delete completed runs older than this many days'
        default: '2'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_DAYS: ${{ inputs.keep_days || '2' }}
        run: |
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting completed runs created before $cutoff"
          gh api --paginate "repos/$REPO/actions/runs?status=completed&created=<$cutoff&per_page=100" \
            --jq '.workflow_runs[].id' > ids.txt
          echo "$(wc -l < ids.txt) runs to delete"
          xargs -P 8 -I{} gh api -X DELETE "repos/$REPO/actions/runs/{}" --silent < ids.txt
