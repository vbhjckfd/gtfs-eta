name: Clean up old workflow runs

on:
  schedule:
    - cron: '17 3 * * *'  # daily
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Delete completed runs older than this many days'
        default: '2'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_DAYS: ${{ inputs.keep_days || '2' }}
        run: |
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting completed runs created before $cutoff"
          # The API returns at most 1000 results per query, so repeat until none are left.
          # A big backlog can exhaust the GITHUB_TOKEN rate limit; stop then and let the
          # next daily run continue instead of failing.
          while :; do
            if ! gh api --paginate "repos/$REPO/actions/runs?status=completed&created=<$cutoff&per_page=100" \
              --jq '.workflow_runs[].id' > ids.txt; then
              echo "::warning::Listing runs failed (likely rate limit); the next run continues"
              break
            fi
            n=$(wc -l < ids.txt)
            echo "$n runs to delete"
            [ "$n" -eq 0 ] && break
            if ! xargs -P 8 -I{} gh api -X DELETE "repos/$REPO/actions/runs/{}" --silent < ids.txt; then
              echo "::warning::Some deletes failed (likely rate limit); the next run continues"
              break
            fi
          done
