name: Weekly model retrain

# Labels any day of the last ~5 weeks not yet in the cache, retrains the
# live_v2 ETA model (src/train_live.py) on the latest 21 days, and exports it
# with its route×hour priors and live tables to R2.
#
# No deploy step: the daemon (push-feed.yml) reloads the model pkl from R2
# fresh every 5 minutes, so export alone goes live.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC — after refresh-gtfs (02:00) and the previous night's route-mae digest

concurrency:
  group: retrain
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 21 training days (src.train_live --days-back) + the 14 before them that
  # feed the historical link / dwell tables, plus one day of slack.
  LABEL_DAYS: '36'

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e . tzdata

      # Restored and saved as separate steps so a run that stops early (the
      # labeling step below is time-boxed) still keeps every day it finished:
      # the old single cache step only saved on success, and every retrain
      # from 2026-08-31 on hit the job timeout, so the cache never warmed and
      # each run started from scratch.
      - name: Restore labeled days
        uses: actions/cache/restore@v4
        with:
          path: |
            data/training
            data/features_live
          key: live-v2-training-${{ github.run_id }}
          restore-keys: |
            live-v2-training-

      - name: Drop days outside the window
        run: |
          cutoff=$(date -u -d "${LABEL_DAYS} days ago" +%F)
          for f in data/training/*.parquet data/training/side/*.parquet data/features_live/*.parquet; do
            [ -e "$f" ] || continue
            day=$(basename "$f" | cut -c1-10)
            if [[ "$day" < "$cutoff" ]]; then rm -f "$f"; fi
          done
          du -sh data 2>/dev/null || true

      # 10% of snapshots per day (whole snapshots), three days at a time: a
      # worker peaks at ~3.5 GB, and the trainer samples far below that
      # anyway. Time-boxed so a cold cache still leaves time to save it; the
      # next run picks up from there.
      - name: Label new days
        id: label
        timeout-minutes: 210
        run: |
          python scripts/run_pipeline.py --all \
            --since "$(date -u -d "${LABEL_DAYS} days ago" +%F)" \
            --until "$(date -u -d yesterday +%F)" \
            --parallel 3 --keep-pct 10
        env:
          PYTHONUNBUFFERED:     '1'
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            gtfs-lviv

      - name: Train live_v2 model
        id: train
        if: steps.label.outcome == 'success'
        timeout-minutes: 100
        run: python -m src.train_live --parallel 3
        env:
          PYTHONUNBUFFERED:     '1'
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            gtfs-lviv

      - name: Save labeled days
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/training
            data/features_live
          key: live-v2-training-${{ github.run_id }}

      - name: Export model + priors to R2
        if: steps.train.outcome == 'success'
        run: python scripts/export_worker_data.py
        env:
          EXPORT_MODEL:         live
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            gtfs-lviv
